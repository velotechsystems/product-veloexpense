# ===========================================================================
# Security — caller stub. Copy to .github/workflows/security.yml.
# Runs SAST / SCA / container scan / secret scan on every PR + weekly.
# ===========================================================================
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security:
    uses: velotechsystems/infra-ci-cd/.github/workflows/security.yml@v1
    with:
      runner_label: ${{ vars.RUNNER_LABEL }}
      backend_dir: ${{ vars.BACKEND_DIR || 'backend' }}
      app_files: ${{ vars.APP_FILES || '' }}
      image_name: ${{ vars.IMAGE_NAME || 'app:scan' }}
      block_on_high_critical: ${{ vars.BLOCK_ON_HIGH_CRITICAL == 'true' }}
      block_semgrep: ${{ vars.BLOCK_SEMGREP == 'true' }}
    secrets: inherit
