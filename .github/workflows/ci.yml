name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Typecheck, build, RLS gate
    runs-on: ubuntu-latest
    # Everything from install to the audit-chain check runs in this one job. Wave 1
    # took it to ~15 minutes (unit + DB suite ~5, Playwright ~5-6, build, crawl), so the
    # old 15-minute ceiling started cancelling green runs mid-e2e. 30 leaves room for the
    # waves still to come; a step that genuinely hangs still fails the run.
    timeout-minutes: 30
    env:
      AUTH_SECRET: ci-test-only-not-a-real-secret
      # VX3-3. 32 bytes of base64 — the integration-credential envelope refuses
      # anything else rather than padding it. CI-only and deliberately not a secret:
      # nothing it encrypts here outlives the job.
      SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # The stub ledger is registered only under this flag, so the suites can drive
      # a full connect -> test -> post round trip with no network.
      INTEGRATIONS_ENABLE_STUB: '1'
      # App connects as the NON-superuser role (RLS must apply); admin resets state.
      ADMIN_DATABASE_URL: postgres://postgres:velo@localhost:5432/veloexpense
      DATABASE_URL: postgres://veloapp:velo@localhost:5432/veloexpense
      # VX5-18. The seed refuses to run against an environment that has not said
      # what it is, so CI has to say. This is the step upstream missed: their CD
      # job passed neither STAGE nor NODE_ENV, the gate read that silence as
      # "local", and it seeded known-password accounts into production. Declaring
      # it here rather than on the seed step means every future step that seeds
      # inherits it — a second seed step added without this line would otherwise
      # fail, and the fix somebody reaches for under time pressure is to weaken
      # the gate.
      STAGE: ci

    services:
      postgres:
        # The official image, mirrored unchanged to ghcr.io by mirror-base-images.yml
        # (f33): anonymous pulls from Docker Hub (f15) and then ECR Public both ran out on
        # GitHub's shared runner IPs. Same image, same tag. See the note in the Dockerfile.
        image: ghcr.io/velotechsystems/base-postgres:16
        env:
          POSTGRES_PASSWORD: velo
          POSTGRES_DB: veloexpense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # When @velotech/* packages are added (VX0-7+), configure the private
      # registry auth here before install, e.g.:
      #   - run: |
      #       echo "@velotech:registry=https://npm.pkg.github.com" >> .npmrc
      #       echo "//npm.pkg.github.com/:_authToken=${{ secrets.VELOTECH_NPM_TOKEN }}" >> .npmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # PR #90's own postmortem. This repo is worked from two machines, and the
      # cloud harness needs two local edits it must never commit: a browser path
      # in playwright.config.ts, and the next/font calls stubbed out in
      # app/layout.tsx (its egress blocks fonts.googleapis.com). #90 copied the
      # config back instead of patching it, shipped
      # `executablePath: '/opt/pw-browsers/...'`, and every one of the 123 specs
      # died at launch — after CI had spent twelve minutes getting to them.
      #
      # A written rule already covered that and was not followed, which is the
      # argument for a gate. FIRST in the job on purpose: it needs no build, no
      # database and no browser, it finishes in under a second, and the failure
      # it catches is the one that otherwise wastes the entire run.
      #
      # NOT in `npm run e2e`, deliberately — the harness has both edits applied
      # and is working correctly when it does, so running this there would fail
      # the build on a correct working copy.
      - name: Harness-leak guard (no build environment in the commit)
        run: npm run check:harness

      # VX3-7. The Plan asks for one adapter contract "so QuickBooks/Xero/Sage are
      # repeatable; avoid per-vendor special cases leaking into core". VX3-8's diff
      # is the real acceptance test for that, but it runs ONCE, on the day somebody
      # writes the second adapter. This runs every build.
      #
      # It caught two things on its first run, and neither was cosmetic:
      # `lib/integrations/dispatch.ts` imported the refused-versus-ambiguous
      # classifier from the VeloLedger adapter BY NAME — so VeloLedger was the only
      # adapter that could report a refusal, and every other adapter's 401 would
      # have become NEEDS_REVIEW, which no automatic path retries. And a CSV
      # validation error shown to admins carried "VeloLedger 0028" in it.
      #
      # Needs no build and no database, so it goes first and fails in seconds.
      - name: Vendor-neutrality guard (no vendor name in core)
        run: npm run check:vendor

      # VX4-7. A locale tag decided outside lib/i18n/locales.ts is a locale the
      # registry cannot move — and the cautionary case is upstream's own i18n
      # gate, which opens by restating `['en', 'fr-CA']` locally. A third locale
      # there is not merely unchecked: every loop iterates the stale pair and
      # PASSES, so the gate reports success about a question it never asked.
      # This one imports the list it polices. Needs no build and no database, so
      # it sits beside the vendor guard and fails in seconds.
      - name: Locale registry guard (no locale tag outside the registry)
        run: npm run check:i18n

      # VX4-9. Fifteen copies of an eight-line admin gate, and `e2e/crawl.spec.ts`
      # found what that costs: every /admin page answered HTTP 500 to a manager,
      # because the copies threw a bare Error inside a server component. The
      # predicate was never wrong — the REFUSAL was indistinguishable from a
      # fault, for the person and for whoever reads the logs.
      #
      # This checks four properties the fix depends on staying true: the gate is
      # declared in one file, every admin actions module imports it, nothing under
      # app/admin reads the session token instead of the database row, and — the
      # one that actually prevents a recurrence — each caller gets the right exit:
      # a page read through `asAdminPage` (renders a 403), a form action through
      # `asAdmin` (throws a catalogued sentence). Needs no build and no database.
      - name: Admin-gate guard (one gate, and the right exit per caller)
        run: npm run check:admin

      # UD-16. Every route names itself, or this fails and says which do not.
      # A GLOB, not a list of routes — upstream's #398 was three pages missing
      # from a hand-kept title map, and a map is a second enumeration that drifts
      # silently. Needs no build and no database.
      - name: Page-title guard (every route names itself)
        run: npm run check:titles

      # An enum member rendered raw inside a <select>. Needs its own gate because
      # the pseudo-locale crawl skips SELECT and OPTION on purpose — a timezone
      # list is data, and counting it took two screens to 497 and 181
      # un-catalogued strings. Four dropdowns were spelling BLOCK and RETURNED
      # beside catalogued labels for the same values. No build, no database.
      - name: Enum-in-a-select guard (no raw member in a dropdown)
        run: npm run check:options

      # 2026 brand: the token sheet, Tailwind glue and shadcn components are
      # vendored copies of lib-ui-kit. Fails when one drifts from the published
      # registry (needs network; the kit is a public GitHub Pages site).
      - name: Kit drift guard (vendored design system = published lib-ui-kit)
        run: npm run check:ui-kit

      # Wave 0 of the ExpenseOS port (decided 7 Oct): ported code runs on Prisma.
      # The client is generated INTO the repo (lib/generated/prisma) so the Docker
      # build never needs the Prisma CLI or its engine download; this regenerates it
      # and fails if the committed copy is stale. Then the scope guard: one
      # PrismaClient (lib/db/prisma.ts, tenant-scoped, throws unscoped) and no
      # $queryRawUnsafe / $executeRawUnsafe anywhere.
      - name: Prisma client is current (regenerate, compare)
        run: npm run prisma:generate && git diff --exit-code lib/generated/prisma
      - name: Prisma scope guard (one scoped client, no unsafe raw SQL)
        run: npm run check:prisma
      # Wave 0: ExpenseOS's own catalogue gates, ported with its catalogues. Every key in
      # `en` exists in every other catalogue locale, and every literal key the ported code
      # asks for (`t('...')`) resolves. packages/i18n/scripts/.
      - name: Ported catalogues (coverage + used keys)
        run: npm run check:catalogs
      # ExpenseOS's phone-project wiring guard, ported with its phone projects. A text scan of
      # playwright.config.ts, e2e/support/phone-projects.ts, package.json and the specs that
      # read the list — no browser, no database — so a phone project declared but wired to
      # nothing fails here rather than measuring nothing in the e2e run below.
      - name: Phone-project wiring (scripts/check-phone-projects.mjs)
        run: npm run check:phone-projects

      # Build first: Next 16 generates .next/types/** (e.g. LayoutProps) that the
      # standalone `tsc --noEmit` typecheck depends on.
      - name: Build
        run: npm run build

      # w3-00. The image runs the worker from this bundle (Dockerfile). Building it here
      # is what catches an import esbuild cannot resolve before the image build does.
      - name: Worker bundle
        run: npm run worker:build

      # VX2-10. A `'use server'` module whose exports Next cannot wrap registers
      # NONE of its actions, builds clean, and fails only in a browser with
      # "Failed to find Server Action …" — a message about deployments, for a
      # problem that is not one. `app/approve` shipped exactly that. This reads
      # the manifest the build just wrote and checks every page with actions
      # actually has some. Runs right after Build, because it needs one.
      - name: Server action registration guard
        run: npm run check:actions

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # ONE runner for CI and for a laptop, which is the point of the change.
      # This used to be a shell loop over every file, correct only because CI's
      # database is empty — so it could never notice the drift that broke VX4-3's
      # e2e run locally, and a developer had no path that shared its behaviour.
      # `scripts/migrate.mjs` applies only what is pending, records it in
      # `schema_migration`, and refuses an edited file or an out-of-order ledger.
      # On CI's fresh database that is exactly the old loop, plus the ledger that
      # `test/migrations.test.ts` then asserts against.
      - name: Apply migrations
        run: npm run migrate

      - name: Create non-superuser app role
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='veloapp') THEN
              CREATE ROLE veloapp LOGIN PASSWORD 'velo';
            END IF;
          END $$;
          GRANT CONNECT ON DATABASE veloexpense TO veloapp;
          GRANT USAGE ON SCHEMA public TO veloapp;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO veloapp;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO veloapp;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO veloapp;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO veloapp;
          SQL

      - name: RLS coverage guard (every tenant table must ENABLE+FORCE RLS)
        run: |
          MISSING=$(psql "$ADMIN_DATABASE_URL" -tAc "
            SELECT string_agg(c.relname, ', ')
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND c.relkind = 'r'
              AND EXISTS (SELECT 1 FROM pg_attribute a
                          WHERE a.attrelid = c.oid AND a.attname = 'organization_id'
                            AND NOT a.attisdropped)
              AND (NOT c.relrowsecurity OR NOT c.relforcerowsecurity);")
          if [ -n "$MISSING" ]; then
            echo "::error::Tables with organization_id but missing ENABLE/FORCE RLS: $MISSING"
            exit 1
          fi
          echo "RLS coverage OK — all tenant tables have ENABLE+FORCE RLS."

      # VX2-10. The guard above proves every tenant table has a POLICY. This one
      # proves the isolation SUITE actually names it — which is a different
      # claim, and the one that rots. A table added with correct RLS and no test
      # is asserted by nobody, and the guard above would stay green forever.
      # VX5-12 moved the logic to `scripts/check-rls-suite.mjs` so it can be run
      # BEFORE a push. It was inline shell here, which meant `npm run check:*`
      # and the whole test suite could pass locally while this failed in CI —
      # which is exactly what happened when `tenant_export` was added.
      - name: RLS isolation coverage (every tenant table must appear in the suite)
        run: npm run check:rls-suite

      # VX3-10. The two guards above are about RLS. This one is about FOREIGN
      # KEYS, and it exists because RLS cannot help with them: Postgres performs
      # referential-integrity checks as the constraint's OWNER with row-level
      # security BYPASSED, so a plain `REFERENCES app_user(id)` accepts another
      # tenant's id — no policy is consulted. Forty-two constraints in this schema
      # were declared that way until migration 0019 (GAP-AUDIT TN-1).
      #
      # test/tenant-fk.db.test.ts carries the same assertion, generated the same
      # way. This step is here so a weakly-declared FK fails the build BEFORE the
      # suite starts, and with a message that says what to write instead — the
      # person who trips it will be somebody adding a table, and the fix is one
      # line they should not have to go and find.
      - name: Tenant FK guard (every tenant-to-tenant FK must be composite)
        run: |
          WEAK=$(psql "$ADMIN_DATABASE_URL" -tAc "
            WITH tenant AS (
              SELECT c.oid, c.relname,
                     (SELECT a.attnum FROM pg_attribute a
                       WHERE a.attrelid = c.oid AND a.attname = 'organization_id'
                         AND NOT a.attisdropped) AS org_attnum
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind = 'r'
                AND EXISTS (SELECT 1 FROM pg_attribute a
                            WHERE a.attrelid = c.oid AND a.attname = 'organization_id'
                              AND NOT a.attisdropped))
            SELECT string_agg(src.relname || '.' || k.conname || ' -> ' || tgt.relname, ', ')
            FROM pg_constraint k
            JOIN tenant src ON src.oid = k.conrelid
            JOIN tenant tgt ON tgt.oid = k.confrelid
            WHERE k.contype = 'f'
              AND (array_position(k.conkey, src.org_attnum) IS NULL
                   OR k.confkey[array_position(k.conkey, src.org_attnum)]
                      IS DISTINCT FROM tgt.org_attnum);")
          if [ -n "$WEAK" ]; then
            echo "::error::Foreign keys that accept another tenant's row: $WEAK"
            echo "Declare each one as:"
            echo "  FOREIGN KEY (organization_id, <col>) REFERENCES <target> (organization_id, id)"
            echo "which needs UNIQUE (organization_id, id) on the target table."
            echo "See prisma/migrations/0019_composite_tenant_fks/migration.sql."
            exit 1
          fi
          echo "Tenant FK guard OK — every tenant-to-tenant FK is composite through organization_id."

      - name: RLS isolation gate + unit tests
        run: npm test

      # The DB suites TRUNCATE, so the demo tenant has to be (re)seeded after
      # them — the e2e signs in as its seeded admin (e2e/auth.setup.ts).
      - name: Seed the demo tenant
        run: npm run seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Starts its own app + S3 surface (playwright.config.ts). It serves the
      # STANDALONE output the build above produced — the same artifact the
      # Docker image runs.
      #
      # DESKTOP ONLY (`chromium`, plus the `setup` project it depends on). The three
      # phone projects run in the `phones` job below, at the same time as this one:
      # ported from ExpenseOS in phone e2e 1-5, they took this job's e2e from about 6
      # minutes to about 17, and #246 was cancelled at the 30-minute ceiling. The
      # role-matrix specs (the `roles` project) run in the `roles` job for the same reason.
      # Every PR still runs every project — just not all in one job.
      - name: End-to-end happy path (Playwright, desktop)
        run: npx playwright test --project=chromium

      # VX4-7 part 3 — IL-5/IL-6. Upstream's equivalent crawler sets
      # `const LOCALE = 'en'` and runs NIGHTLY, which is the audit's finding: a
      # guard watching one of three locales, on a schedule nobody reads. This
      # runs PER PR, and in a pseudo-locale, so it can answer the question the
      # static gate cannot — is this string coming from a catalogue at all.
      #
      # Its own config and its own server, on shifted ports: the pseudo flag is
      # read once at boot (lib/i18n/pseudo.ts explains why), so it cannot share
      # the server above. About twenty seconds.
      - name: Pseudo-locale crawl (per PR, not nightly)
        run: npm run e2e:crawl

      # VX2-10. The board asks for "chain verification runs on every build", and
      # until now it did not: `verifyChain` is exercised by test/audit.db.test.ts
      # and by VX2-9's suite, over rows those suites wrote themselves. This runs
      # it over EVERY tenant in the database as it stands after the seed and the
      # e2e — so it covers rows written by the app through its real paths, which
      # is the only version of this check that could ever catch a real regression.
      #
      # Per tenant, deliberately: the chain is per-tenant (GAP-AUDIT AU-1), and a
      # global walk would interleave two chains and fail on a correct database.
      - name: Audit chain verification (every tenant, after the e2e)
        run: npx vitest run --config vitest.chain.config.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  phones:
    # The three phone projects (`mobile-360`, `mobile-390`, `mobile-412`;
    # `npm run test:e2e:mobile`), split out of `quality` so neither job nears its
    # ceiling — see the note on the desktop e2e step there. ExpenseOS runs all of its
    # browser projects nightly (`e2e-nightly.yml`); VeloExpense runs them on every PR.
    #
    # Its own database and its own build, because a job shares nothing with another:
    # the steps below are `quality`'s, minus every guard, the unit and DB suites, the
    # crawl and the audit-chain check — all of which `quality` already runs on the same
    # commit. The chain check is left out rather than repeated because its second test
    # requires an approval and a reimbursement in the chain (`test/chain-verify.check.ts`),
    # which the desktop e2e walks and the phone specs do not.
    name: End-to-end (phones)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_SECRET: ci-test-only-not-a-real-secret
      SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      INTEGRATIONS_ENABLE_STUB: '1'
      ADMIN_DATABASE_URL: postgres://postgres:velo@localhost:5432/veloexpense
      DATABASE_URL: postgres://veloapp:velo@localhost:5432/veloexpense
      STAGE: ci

    services:
      postgres:
        # The same image as `quality`'s; see the note there. It said so from the start and
        # pointed at ECR Public anyway: #248 copied this job from a stale copy of ci.yml that
        # predated f33, and #250's run then failed this pull on ECR Public's data limit.
        image: ghcr.io/velotechsystems/base-postgres:16
        env:
          POSTGRES_PASSWORD: velo
          POSTGRES_DB: veloexpense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The e2e serves the standalone output (playwright.config.ts).
      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npm run migrate

      # `quality`'s role step, verbatim: the app connects as `veloapp` so RLS applies.
      - name: Create non-superuser app role
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='veloapp') THEN
              CREATE ROLE veloapp LOGIN PASSWORD 'velo';
            END IF;
          END $$;
          GRANT CONNECT ON DATABASE veloexpense TO veloapp;
          GRANT USAGE ON SCHEMA public TO veloapp;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO veloapp;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO veloapp;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO veloapp;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO veloapp;
          SQL

      - name: Seed the demo tenant
        run: npm run seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end (Playwright, phone projects)
        run: npm run test:e2e:mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-phones
          path: |
            playwright-report/
            test-results/
            e2e/.artifacts/
          retention-days: 7

  roles:
    # ExpenseOS's role-matrix specs (the `roles` Playwright project; `npm run test:e2e:roles`):
    # every page walked and every safe control clicked as each seeded role, and each role's
    # reach probed. About fourteen minutes of browser time, so a job of its own beside
    # `quality` and `phones`, built the same way as `phones` — see the notes there.
    name: End-to-end (roles)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_SECRET: ci-test-only-not-a-real-secret
      SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      INTEGRATIONS_ENABLE_STUB: '1'
      ADMIN_DATABASE_URL: postgres://postgres:velo@localhost:5432/veloexpense
      DATABASE_URL: postgres://veloapp:velo@localhost:5432/veloexpense
      STAGE: ci

    services:
      postgres:
        # The same image as `quality`'s; see the note there.
        image: ghcr.io/velotechsystems/base-postgres:16
        env:
          POSTGRES_PASSWORD: velo
          POSTGRES_DB: veloexpense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The e2e serves the standalone output (playwright.config.ts).
      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npm run migrate

      # `quality`'s role step, verbatim: the app connects as `veloapp` so RLS applies.
      - name: Create non-superuser app role
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='veloapp') THEN
              CREATE ROLE veloapp LOGIN PASSWORD 'velo';
            END IF;
          END $$;
          GRANT CONNECT ON DATABASE veloexpense TO veloapp;
          GRANT USAGE ON SCHEMA public TO veloapp;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO veloapp;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO veloapp;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO veloapp;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO veloapp;
          SQL

      - name: Seed the demo tenant
        run: npm run seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end (Playwright, role matrix)
        run: npm run test:e2e:roles

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-roles
          path: |
            playwright-report/
            test-results/
            e2e-role-crawl*.md
            e2e-role-interact*.md
            e2e-permission-matrix.md
          retention-days: 7

  infra:
    # The CDK app (infrastructure/cdk) has its own package.json, tsconfig and
    # tests, so it is its own job: synthesising every stack and asserting what
    # the templates must not contain (rules on the shared ALB group, the master
    # login in the web task) needs no database and no AWS credentials — the
    # shared infrastructure is read from SSM at DEPLOY time, not at synth.
    name: Infrastructure (CDK typecheck + template tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infrastructure/cdk/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
