name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Typecheck, build, RLS gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET: ci-test-only-not-a-real-secret
      # VX3-3. 32 bytes of base64 — the integration-credential envelope refuses
      # anything else rather than padding it. CI-only and deliberately not a secret:
      # nothing it encrypts here outlives the job.
      SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # The stub ledger is registered only under this flag, so the suites can drive
      # a full connect -> test -> post round trip with no network.
      INTEGRATIONS_ENABLE_STUB: '1'
      # App connects as the NON-superuser role (RLS must apply); admin resets state.
      ADMIN_DATABASE_URL: postgres://postgres:velo@localhost:5432/veloexpense
      DATABASE_URL: postgres://veloapp:velo@localhost:5432/veloexpense

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: velo
          POSTGRES_DB: veloexpense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # When @velotech/* packages are added (VX0-7+), configure the private
      # registry auth here before install, e.g.:
      #   - run: |
      #       echo "@velotech:registry=https://npm.pkg.github.com" >> .npmrc
      #       echo "//npm.pkg.github.com/:_authToken=${{ secrets.VELOTECH_NPM_TOKEN }}" >> .npmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # VX3-7. The Plan asks for one adapter contract "so QuickBooks/Xero/Sage are
      # repeatable; avoid per-vendor special cases leaking into core". VX3-8's diff
      # is the real acceptance test for that, but it runs ONCE, on the day somebody
      # writes the second adapter. This runs every build.
      #
      # It caught two things on its first run, and neither was cosmetic:
      # `lib/integrations/dispatch.ts` imported the refused-versus-ambiguous
      # classifier from the VeloLedger adapter BY NAME — so VeloLedger was the only
      # adapter that could report a refusal, and every other adapter's 401 would
      # have become NEEDS_REVIEW, which no automatic path retries. And a CSV
      # validation error shown to admins carried "VeloLedger 0028" in it.
      #
      # Needs no build and no database, so it goes first and fails in seconds.
      - name: Vendor-neutrality guard (no vendor name in core)
        run: npm run check:vendor

      # VX4-7. A locale tag decided outside lib/i18n/locales.ts is a locale the
      # registry cannot move — and the cautionary case is upstream's own i18n
      # gate, which opens by restating `['en', 'fr-CA']` locally. A third locale
      # there is not merely unchecked: every loop iterates the stale pair and
      # PASSES, so the gate reports success about a question it never asked.
      # This one imports the list it polices. Needs no build and no database, so
      # it sits beside the vendor guard and fails in seconds.
      - name: Locale registry guard (no locale tag outside the registry)
        run: npm run check:i18n

      # Build first: Next 16 generates .next/types/** (e.g. LayoutProps) that the
      # standalone `tsc --noEmit` typecheck depends on.
      - name: Build
        run: npm run build

      # VX2-10. A `'use server'` module whose exports Next cannot wrap registers
      # NONE of its actions, builds clean, and fails only in a browser with
      # "Failed to find Server Action …" — a message about deployments, for a
      # problem that is not one. `app/approve` shipped exactly that. This reads
      # the manifest the build just wrote and checks every page with actions
      # actually has some. Runs right after Build, because it needs one.
      - name: Server action registration guard
        run: npm run check:actions

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # ONE runner for CI and for a laptop, which is the point of the change.
      # This used to be a shell loop over every file, correct only because CI's
      # database is empty — so it could never notice the drift that broke VX4-3's
      # e2e run locally, and a developer had no path that shared its behaviour.
      # `scripts/migrate.mjs` applies only what is pending, records it in
      # `schema_migration`, and refuses an edited file or an out-of-order ledger.
      # On CI's fresh database that is exactly the old loop, plus the ledger that
      # `test/migrations.test.ts` then asserts against.
      - name: Apply migrations
        run: npm run migrate

      - name: Create non-superuser app role
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='veloapp') THEN
              CREATE ROLE veloapp LOGIN PASSWORD 'velo';
            END IF;
          END $$;
          GRANT CONNECT ON DATABASE veloexpense TO veloapp;
          GRANT USAGE ON SCHEMA public TO veloapp;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO veloapp;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO veloapp;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO veloapp;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO veloapp;
          SQL

      - name: RLS coverage guard (every tenant table must ENABLE+FORCE RLS)
        run: |
          MISSING=$(psql "$ADMIN_DATABASE_URL" -tAc "
            SELECT string_agg(c.relname, ', ')
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND c.relkind = 'r'
              AND EXISTS (SELECT 1 FROM pg_attribute a
                          WHERE a.attrelid = c.oid AND a.attname = 'organization_id'
                            AND NOT a.attisdropped)
              AND (NOT c.relrowsecurity OR NOT c.relforcerowsecurity);")
          if [ -n "$MISSING" ]; then
            echo "::error::Tables with organization_id but missing ENABLE/FORCE RLS: $MISSING"
            exit 1
          fi
          echo "RLS coverage OK — all tenant tables have ENABLE+FORCE RLS."

      # VX2-10. The guard above proves every tenant table has a POLICY. This one
      # proves the isolation SUITE actually names it — which is a different
      # claim, and the one that rots. A table added with correct RLS and no test
      # is asserted by nobody, and the guard above would stay green forever.
      - name: RLS isolation coverage (every tenant table must appear in the suite)
        run: |
          TABLES=$(psql "$ADMIN_DATABASE_URL" -tAc "
            SELECT c.relname
            FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND c.relkind = 'r'
              AND EXISTS (SELECT 1 FROM pg_attribute a
                          WHERE a.attrelid = c.oid AND a.attname = 'organization_id'
                            AND NOT a.attisdropped)
            ORDER BY c.relname;")
          UNTESTED=""
          for t in $TABLES; do
            grep -q "\b$t\b" test/rls-isolation.test.ts || UNTESTED="$UNTESTED $t"
          done
          if [ -n "$UNTESTED" ]; then
            echo "::error::Tenant tables absent from test/rls-isolation.test.ts:$UNTESTED"
            exit 1
          fi
          echo "Isolation coverage OK — every tenant table is named in the suite."

      # VX3-10. The two guards above are about RLS. This one is about FOREIGN
      # KEYS, and it exists because RLS cannot help with them: Postgres performs
      # referential-integrity checks as the constraint's OWNER with row-level
      # security BYPASSED, so a plain `REFERENCES app_user(id)` accepts another
      # tenant's id — no policy is consulted. Forty-two constraints in this schema
      # were declared that way until migration 0019 (GAP-AUDIT TN-1).
      #
      # test/tenant-fk.db.test.ts carries the same assertion, generated the same
      # way. This step is here so a weakly-declared FK fails the build BEFORE the
      # suite starts, and with a message that says what to write instead — the
      # person who trips it will be somebody adding a table, and the fix is one
      # line they should not have to go and find.
      - name: Tenant FK guard (every tenant-to-tenant FK must be composite)
        run: |
          WEAK=$(psql "$ADMIN_DATABASE_URL" -tAc "
            WITH tenant AS (
              SELECT c.oid, c.relname,
                     (SELECT a.attnum FROM pg_attribute a
                       WHERE a.attrelid = c.oid AND a.attname = 'organization_id'
                         AND NOT a.attisdropped) AS org_attnum
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind = 'r'
                AND EXISTS (SELECT 1 FROM pg_attribute a
                            WHERE a.attrelid = c.oid AND a.attname = 'organization_id'
                              AND NOT a.attisdropped))
            SELECT string_agg(src.relname || '.' || k.conname || ' -> ' || tgt.relname, ', ')
            FROM pg_constraint k
            JOIN tenant src ON src.oid = k.conrelid
            JOIN tenant tgt ON tgt.oid = k.confrelid
            WHERE k.contype = 'f'
              AND (array_position(k.conkey, src.org_attnum) IS NULL
                   OR k.confkey[array_position(k.conkey, src.org_attnum)]
                      IS DISTINCT FROM tgt.org_attnum);")
          if [ -n "$WEAK" ]; then
            echo "::error::Foreign keys that accept another tenant's row: $WEAK"
            echo "Declare each one as:"
            echo "  FOREIGN KEY (organization_id, <col>) REFERENCES <target> (organization_id, id)"
            echo "which needs UNIQUE (organization_id, id) on the target table."
            echo "See prisma/migrations/0019_composite_tenant_fks/migration.sql."
            exit 1
          fi
          echo "Tenant FK guard OK — every tenant-to-tenant FK is composite through organization_id."

      - name: RLS isolation gate + unit tests
        run: npm test

      # The DB suites TRUNCATE, so the demo tenant has to be (re)seeded after
      # them — the e2e signs in as its seeded admin (e2e/auth.setup.ts).
      - name: Seed the demo tenant
        run: npm run seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Starts its own app + S3 surface (playwright.config.ts). It serves the
      # STANDALONE output the build above produced — the same artifact the
      # Docker image runs.
      - name: End-to-end happy path (Playwright)
        run: npx playwright test

      # VX4-7 part 3 — IL-5/IL-6. Upstream's equivalent crawler sets
      # `const LOCALE = 'en'` and runs NIGHTLY, which is the audit's finding: a
      # guard watching one of three locales, on a schedule nobody reads. This
      # runs PER PR, and in a pseudo-locale, so it can answer the question the
      # static gate cannot — is this string coming from a catalogue at all.
      #
      # Its own config and its own server, on shifted ports: the pseudo flag is
      # read once at boot (lib/i18n/pseudo.ts explains why), so it cannot share
      # the server above. About twenty seconds.
      - name: Pseudo-locale crawl (per PR, not nightly)
        run: npm run e2e:crawl

      # VX2-10. The board asks for "chain verification runs on every build", and
      # until now it did not: `verifyChain` is exercised by test/audit.db.test.ts
      # and by VX2-9's suite, over rows those suites wrote themselves. This runs
      # it over EVERY tenant in the database as it stands after the seed and the
      # e2e — so it covers rows written by the app through its real paths, which
      # is the only version of this check that could ever catch a real regression.
      #
      # Per tenant, deliberately: the chain is per-tenant (GAP-AUDIT AU-1), and a
      # global walk would interleave two chains and fail on a correct database.
      - name: Audit chain verification (every tenant, after the e2e)
        run: npx vitest run --config vitest.chain.config.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
