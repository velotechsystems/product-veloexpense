name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Typecheck, build, RLS gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET: ci-test-only-not-a-real-secret
      # App connects as the NON-superuser role (RLS must apply); admin resets state.
      ADMIN_DATABASE_URL: postgres://postgres:velo@localhost:5432/veloexpense
      DATABASE_URL: postgres://veloapp:velo@localhost:5432/veloexpense

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: velo
          POSTGRES_DB: veloexpense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # When @velotech/* packages are added (VX0-7+), configure the private
      # registry auth here before install, e.g.:
      #   - run: |
      #       echo "@velotech:registry=https://npm.pkg.github.com" >> .npmrc
      #       echo "//npm.pkg.github.com/:_authToken=${{ secrets.VELOTECH_NPM_TOKEN }}" >> .npmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Build first: Next 16 generates .next/types/** (e.g. LayoutProps) that the
      # standalone `tsc --noEmit` typecheck depends on.
      - name: Build
        run: npm run build

      # VX2-10. A `'use server'` module whose exports Next cannot wrap registers
      # NONE of its actions, builds clean, and fails only in a browser with
      # "Failed to find Server Action …" — a message about deployments, for a
      # problem that is not one. `app/approve` shipped exactly that. This reads
      # the manifest the build just wrote and checks every page with actions
      # actually has some. Runs right after Build, because it needs one.
      - name: Server action registration guard
        run: npm run check:actions

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply migrations
        run: |
          for f in prisma/migrations/*/migration.sql; do
            echo "applying $f"
            psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Create non-superuser app role
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='veloapp') THEN
              CREATE ROLE veloapp LOGIN PASSWORD 'velo';
            END IF;
          END $$;
          GRANT CONNECT ON DATABASE veloexpense TO veloapp;
          GRANT USAGE ON SCHEMA public TO veloapp;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO veloapp;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO veloapp;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO veloapp;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO veloapp;
          SQL

      - name: RLS coverage guard (every tenant table must ENABLE+FORCE RLS)
        run: |
          MISSING=$(psql "$ADMIN_DATABASE_URL" -tAc "
            SELECT string_agg(c.relname, ', ')
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND c.relkind = 'r'
              AND EXISTS (SELECT 1 FROM pg_attribute a
                          WHERE a.attrelid = c.oid AND a.attname = 'organization_id'
                            AND NOT a.attisdropped)
              AND (NOT c.relrowsecurity OR NOT c.relforcerowsecurity);")
          if [ -n "$MISSING" ]; then
            echo "::error::Tables with organization_id but missing ENABLE/FORCE RLS: $MISSING"
            exit 1
          fi
          echo "RLS coverage OK — all tenant tables have ENABLE+FORCE RLS."

      # VX2-10. The guard above proves every tenant table has a POLICY. This one
      # proves the isolation SUITE actually names it — which is a different
      # claim, and the one that rots. A table added with correct RLS and no test
      # is asserted by nobody, and the guard above would stay green forever.
      - name: RLS isolation coverage (every tenant table must appear in the suite)
        run: |
          TABLES=$(psql "$ADMIN_DATABASE_URL" -tAc "
            SELECT c.relname
            FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND c.relkind = 'r'
              AND EXISTS (SELECT 1 FROM pg_attribute a
                          WHERE a.attrelid = c.oid AND a.attname = 'organization_id'
                            AND NOT a.attisdropped)
            ORDER BY c.relname;")
          UNTESTED=""
          for t in $TABLES; do
            grep -q "\b$t\b" test/rls-isolation.test.ts || UNTESTED="$UNTESTED $t"
          done
          if [ -n "$UNTESTED" ]; then
            echo "::error::Tenant tables absent from test/rls-isolation.test.ts:$UNTESTED"
            exit 1
          fi
          echo "Isolation coverage OK — every tenant table is named in the suite."

      - name: RLS isolation gate + unit tests
        run: npm test

      # The DB suites TRUNCATE, so the demo tenant has to be (re)seeded after
      # them — the e2e signs in as its seeded admin (e2e/auth.setup.ts).
      - name: Seed the demo tenant
        run: npm run seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Starts its own app + S3 surface (playwright.config.ts). It serves the
      # STANDALONE output the build above produced — the same artifact the
      # Docker image runs.
      - name: End-to-end happy path (Playwright)
        run: npx playwright test

      # VX2-10. The board asks for "chain verification runs on every build", and
      # until now it did not: `verifyChain` is exercised by test/audit.db.test.ts
      # and by VX2-9's suite, over rows those suites wrote themselves. This runs
      # it over EVERY tenant in the database as it stands after the seed and the
      # e2e — so it covers rows written by the app through its real paths, which
      # is the only version of this check that could ever catch a real regression.
      #
      # Per tenant, deliberately: the chain is per-tenant (GAP-AUDIT AU-1), and a
      # global walk would interleave two chains and fail on a correct database.
      - name: Audit chain verification (every tenant, after the e2e)
        run: npx vitest run --config vitest.chain.config.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
